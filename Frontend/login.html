<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CivicLens</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      padding: 1.5rem;
    }
    .standalone-auth-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2563eb, #0d9488);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }
    .auth-brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 700;
    }
    .auth-brand p {
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .auth-footer-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .auth-footer-links a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="standalone-auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon">🔍</div>
      <h1>CivicLens</h1>
      <p>AI Infrastructure Auditor &amp; Complaint System</p>
    </div>

    <form onsubmit="handleLoginSubmit(event)">
      <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 4px;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem;">Sign in to report and track civic issues in your area</p>

      <div id="authAlert" style="display: none; padding: 12px 14px; border-radius: 12px; margin-bottom: 1rem; font-size: 0.85rem; line-height: 1.4; border: 1px solid rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.15); color: #fca5a5;"></div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="citizen@civiclens.org" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 12px; padding: 14px;">
        Sign In to CivicLens
      </button>

      <div style="display: flex; align-items: center; margin: 16px 0; color: #94a3b8; font-size: 0.8rem;">
        <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
        <span style="padding: 0 10px;">OR</span>
        <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
      </div>

      <button type="button" class="btn-auth" id="btnGoogleAuth" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: #ffffff; color: #0f172a; font-weight: 600; transition: all 0.2s ease;" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Sign in with Google
      </button>
    </form>

    <div class="auth-footer-links">
      Don't have an account? <a href="register.html">Create Account</a>
    </div>
  </div>

  <!-- Firebase Web SDK CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    function showAlert(message, isWarning = true) {
      const alertBox = document.getElementById('authAlert');
      alertBox.style.display = 'block';
      alertBox.style.borderColor = isWarning ? 'rgba(239, 68, 68, 0.4)' : 'rgba(16, 185, 129, 0.4)';
      alertBox.style.background = isWarning ? 'rgba(239, 68, 68, 0.15)' : 'rgba(16, 185, 129, 0.15)';
      alertBox.style.color = isWarning ? '#fca5a5' : '#6ee7b7';
      alertBox.innerHTML = `<strong>${isWarning ? '⚠️ Sign-In Notice' : '✅ Notice'}:</strong> ${message}`;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      document.getElementById('authAlert').style.display = 'none';
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const result = await loginWithFirebase(email, password);

      if (result.success) {
        localStorage.setItem('civiclens_user', result.user.email);
        window.location.href = 'dashboard.html';
      } else {
        showAlert(result.error, true);
        if (result.error.toLowerCase().includes('google')) {
          const btnG = document.getElementById('btnGoogleAuth');
          btnG.style.boxShadow = '0 0 15px rgba(59, 130, 246, 0.8)';
          btnG.style.border = '2px solid #3b82f6';
        } else if (result.error.toLowerCase().includes('phone')) {
          const btnP = document.getElementById('btnPhoneAuthToggle');
          btnP.style.boxShadow = '0 0 15px rgba(56, 189, 248, 0.8)';
          btnP.style.border = '2px solid #38bdf8';
        }
      }
    }

    async function handleGoogleSignIn() {
      document.getElementById('authAlert').style.display = 'none';
      const btnG = document.getElementById('btnGoogleAuth');
      if (btnG) btnG.innerText = 'Connecting to Google Auth...';

      const result = await loginWithGoogle();
      if (result.success) {
        localStorage.setItem('civiclens_user', result.user.email);
        showAlert("Sign in successful! Redirecting to CivicLens Dashboard...", false);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } else {
        if (btnG) btnG.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg> Sign in with Google';
        showAlert(result.error, !result.redirected);
      }
    }
  </script>
</body>
</html>
